name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew
      - name: Assemble debug
        run: ./gradlew assembleDebug
      - name: Lint
        run: ./gradlew lintDebug
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report-${{ github.sha }}
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14

      - name: Find existing PR comment
        if: github.event_name == 'pull_request'
        uses: peter-evans/find-comment@v3
        id: fc
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: 'Automated Build APK Ready'

      - name: Create or update PR comment
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ### 🤖 Automated Build APK Ready!

            A new debug APK build is ready for testing.

            * **Commit:** `${{ github.sha }}`
            * **Branch:** `${{ github.head_ref || github.ref_name }}`

            📥 **Download Artifact:** You can download the build artifact directly from the [GitHub Actions CI Run Page](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
          edit-mode: replace
