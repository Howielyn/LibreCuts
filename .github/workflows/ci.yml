name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew
      - name: Assemble debug
        run: ./gradlew assembleDebug
      - name: Lint
        run: ./gradlew lintDebug
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report-${{ github.sha }}
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14

      - name: Create or update PR & Issue comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;
            const bodyIdentifier = '### 🤖 Automated Build APK Ready!';
            const body = `${bodyIdentifier}\n\nA new debug APK build is ready for testing.\n\n* **Commit:** \`${context.sha}\`\n* **Branch:** \`${context.payload.pull_request ? context.payload.pull_request.head.ref : context.ref}\` \n\n📥 **Download Artifact:** You can download the build artifact directly from the [GitHub Actions CI Run Page](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`;

            // Helper to post or update comment on a target issue/PR ID
            async function postOrUpdateComment(targetId) {
              try {
                const { data: comments } = await github.rest.issues.listComments({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: targetId,
                });

                const botComment = comments.find(comment =>
                  comment.user.type === 'Bot' && comment.body.includes(bodyIdentifier)
                );

                if (botComment) {
                  await github.rest.issues.updateComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: botComment.id,
                    body: body,
                  });
                } else {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: targetId,
                    body: body,
                  });
                }
              } catch (err) {
                console.log(`Failed to comment on #${targetId}: ${err.message}`);
              }
            }

            // Always comment on the PR
            await postOrUpdateComment(prNumber);

            // Check if PR body links an issue (e.g. "Fixes #42", "Closes #42", "Resolves #42")
            const prBody = context.payload.pull_request ? context.payload.pull_request.body || '' : '';
            const branchName = context.payload.pull_request ? context.payload.pull_request.head.ref : '';
            
            const matchBody = prBody.match(/(?:fixes|closes|resolves)\s+#(\d+)/i);
            const matchBranch = branchName.match(/(?:issue|fix)[\/-]?(\d+)/i);

            const linkedIssue = matchBody ? parseInt(matchBody[1], 10) : (matchBranch ? parseInt(matchBranch[1], 10) : null);

            if (linkedIssue && linkedIssue !== prNumber) {
              console.log(`Posting APK build comment to linked issue #${linkedIssue}`);
              await postOrUpdateComment(linkedIssue);
            }

